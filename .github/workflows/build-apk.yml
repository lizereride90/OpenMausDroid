name: build-apk

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime bundle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/bundle
          cd app/src/main/assets/bundle
          curl -fL --retry 3 -o ubuntu.tar.gz \
            "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-arm64.tar.gz"
          curl -fL --retry 3 -o proot \
            "https://github.com/ysdragon/proot-static/releases/download/v5.4.0/proot-aarch64-static"
          curl -fL --retry 3 -o ttyd \
            "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.aarch64"
          chmod +x proot ttyd
          gzip -t ubuntu.tar.gz
          # aapt2 silently gunzips *.gz assets and strips the extension, so the
          # tarball must be packaged under a name that does not end in .gz.
          mv ubuntu.tar.gz ubuntu-rootfs.bin
          # Some ROMs refuse to exec() binaries from the app data dir, so ship
          # proot/ttyd as native libs too: the installer extracts them to the
          # app's lib/ dir (executable) and the app runs them from there.
          mkdir -p ../../jniLibs/arm64-v8a
          cp proot ../../jniLibs/arm64-v8a/libproot.so
          cp ttyd ../../jniLibs/arm64-v8a/libttyd.so
          # Best-effort: Termux-built proot (bionic-linked, Android-native
          # syscall profile) plus its shared libs, as a fallback candidate
          # for ROMs whose seccomp policy kills the generic static build.
          TPOOL=https://packages.termux.dev/apt/termux-main
          PKGIDX=$(curl -fsSL --retry 2 "$TPOOL/dists/stable/main/binary-aarch64/Packages" || true)
          for p in proot libtalloc libandroid-shmem; do
            f=$(printf '%s' "$PKGIDX" | awk -v pkg="$p" 'BEGIN{RS=""; FS="\n"} $0 ~ "(^|\n)Package: "pkg"(\n|$)" {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub(/^Filename: /,"",$i); print $i; exit}}' || true)
            if [ -n "$f" ]; then
              curl -fsSL --retry 2 -o "/tmp/$p.deb" "$TPOOL/$f" && echo "got $p" || echo "skip $p"
            else
              echo "skip $p (not in index)"
            fi
          done
          if [ -f /tmp/proot.deb ] && [ -f /tmp/libtalloc.deb ] && [ -f /tmp/libandroid-shmem.deb ]; then
            rm -rf /tmp/tx && mkdir -p /tmp/tx/proot /tmp/tx/talloc /tmp/tx/shmem
            (cd /tmp/tx/proot && ar x /tmp/proot.deb && tar -xf data.tar.*) || echo "extract failed: proot"
            (cd /tmp/tx/talloc && ar x /tmp/libtalloc.deb && tar -xf data.tar.*) || echo "extract failed: talloc"
            (cd /tmp/tx/shmem && ar x /tmp/libandroid-shmem.deb && tar -xf data.tar.*) || echo "extract failed: shmem"
            find /tmp/tx/proot -name proot -type f -size +50k -exec cp {} ../../jniLibs/arm64-v8a/libprootT.so \;
            find /tmp/tx/talloc -name 'libtalloc.so*' -exec cp {} ../../jniLibs/arm64-v8a/ \;
            # proot's DT_NEEDED names libtalloc.so.2 exactly - make sure that
            # filename exists no matter which libtalloc files the deb carried.
            TALLOC_SRC=$(find ../../jniLibs/arm64-v8a -maxdepth 1 -name 'libtalloc.so*' | head -n 1 || true)
            if [ -n "$TALLOC_SRC" ]; then cp "$TALLOC_SRC" ../../jniLibs/arm64-v8a/libtalloc.so.2; fi
            find /tmp/tx/shmem -name 'libandroid-shmem.so' -exec cp {} ../../jniLibs/arm64-v8a/ \;
            sudo apt-get install -y -q patchelf >/dev/null 2>&1 || true
            patchelf --set-rpath '$ORIGIN' ../../jniLibs/arm64-v8a/libprootT.so \
              && patchelf --print-rpath ../../jniLibs/arm64-v8a/libprootT.so || echo "no rpath patch"
          else
            echo "termux proot unavailable, single-proot build"
          fi
          ls -lh
          ls -lh ../../jniLibs/arm64-v8a

      - name: Configure signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MAUS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            echo "MAUS_KEYSTORE=/tmp/release.keystore" >> "$GITHUB_ENV"
            echo "MAUS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MAUS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MAUS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore secrets - APK will be debug-signed."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$src" OpenMausDroid.apk
          ls -lh OpenMausDroid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMausDroid-apk
          path: OpenMausDroid.apk
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenMausDroid.apk
